onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"
split_vertical = "prefix+backslash"

# Captain theme: [theme.custom] overrides on the catppuccin base.
# Herdr has no named custom themes; this block IS the captain theme here.
# Status dots draw from these tokens: working=yellow (captain purple),
# done=green (solid), idle=green (hollow), blocked=red.
[theme.custom]
accent = "#7c6faf"
panel_bg = "#0d0d10"
surface0 = "#222226"
surface1 = "#151518"
surface_dim = "#1a1a1f"
overlay0 = "#71717a"
overlay1 = "#a1a1aa"
text = "#f4f4f5"
subtext0 = "#a1a1aa"
mauve = "#8d7fc0"
green = "#7da876"
red = "#d06f82"
blue = "#38bdf8"
teal = "#8ba888"
yellow = "#8d7fc0"
peach = "#8d7fc0"
