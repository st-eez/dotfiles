onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"
split_vertical = "prefix+backslash"

# Captain theme: [theme.custom] overrides on the catppuccin base.
# Herdr has no named custom themes; this block IS the captain theme here.
# Status dots draw from these tokens: working=yellow (captain purple),
# done=green (solid), idle=green (hollow), blocked=red.
# Neutrals are Captain's Pi ramp; these hexes match captain/.pi/themes/captain.json
# verbatim, and captain/docs/prime-theme.md carries the roles and contrast ratios.
[theme.custom]
accent = "#7c6faf"
active_row_bg = "#242639"
panel_bg = "#1a1b26"
surface0 = "#242639"
surface1 = "#151518"
surface_dim = "#222334"
overlay0 = "#9093a3"
overlay1 = "#a9abba"
text = "#d2d3de"
subtext0 = "#a9abba"
mauve = "#8d7fc0"
green = "#7da876"
red = "#d06f82"
blue = "#38bdf8"
teal = "#8ba888"
yellow = "#8d7fc0"
peach = "#8d7fc0"
