# True color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Start windows and panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl tap (Karabiner sends Ctrl+Space) with Ctrl+b as fallback
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Scrollback buffer (default 2000 is too small for Claude Code sessions)
set -g history-limit 50000

# No escape delay (faster neovim mode switching)
set -sg escape-time 0

# New windows/splits open in current directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane cycling: prefix o is the built-in "next pane"; add prefix O for "previous".
# Wired from Ghostty as Cmd+] / Cmd+[ respectively.
bind-key O select-pane -t :.-

# Directional pane navigation without prefix — wired from Ghostty as Cmd+Alt+arrows.
# Raw Alt+arrows are claimed by aerospace at OS level, so Alt+arrow bytes only
# reach tmux via our Cmd+Alt+arrow chord. No-prefix avoids the brief prefix flash.
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf

# Ghostty Cmd+K sends Ctrl+l; clear the pane first, then prune scrollback after redraw
bind-key -n C-l send-keys C-l \; run-shell -b -d 0.2 'tmux clear-history -t "#{pane_id}"'

# Let programs detect pane focus changes
set -g focus-events on

# Allow escape sequences to pass through to Ghostty
set -g allow-passthrough on

# Mouse support
set -g mouse on

# Click the trailing `+` cap in the tab row to open a new window in the current path.
# Falls back to the default switch-client behavior for window-range clicks.
bind-key -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},new-window}' 'new-window -c "#{pane_current_path}"' 'switch-client -t ='

# Auto-rebalance panes evenly when one closes
set-hook -g pane-exited      'select-layout -E'
set-hook -g after-kill-pane   'select-layout -E'

# Sticky spawner-scoped agent attention: entering a window retires every
# attention record whose spawner_pane lives inside it (steez-ht6x).
# after-select-window covers in-session window switches; client-session-changed
# covers cross-session `switch-client -t <session>`, which does not fire
# after-select-window. The helper lives out-of-line because tmux format
# expansion in run-shell consumes `$var`, which would empty any inline
# while/read loop.
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/hooks/ack-spawner-attention.sh \"#{window_id}\""'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/hooks/ack-spawner-attention.sh \"#{window_id}\""'

# Status bar settings
set -g status-position top
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 0

# Window auto-naming: show directory by default, prefix+, to override
set -g automatic-rename on
set -g automatic-rename-format "/#{b:pane_current_path}"

# Source theme (symlinked by theme-set, sets @thm_* colors)
source-file ~/.config/tmux/theme.conf

# Show pane number on border to indicate active pane
set -g pane-border-style "fg=#{@thm_overlay_2}"
set -g pane-active-border-style "fg=#{@thm_teal},bold"
set -g pane-border-status top
set -g pane-border-indicators off
set -g pane-border-format "#{?pane_active,#{?client_prefix,#[fg=#{@thm_fg} bg=#{@thm_teal} bold][[ PREFIX #{window_index}.#{pane_index} ]]#[default],#[fg=#{@thm_crust} bg=#{@thm_teal} bold][ #{window_index}.#{pane_index} ]#[default]},#[fg=#{@thm_overlay_0}][ #{window_index}.#{pane_index} ]#[default]}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# ── Custom status bar (Ghostty-style tabs) ───────────────────────────────────
# A small renderer gives tmux windows equal-width, full-row tab segments.
# Agent attention is rendered inside the tab row; prefix remains on the pane label.
set -g status-style "bg=#{@thm_crust},fg=#{@thm_fg}"
set -g status-left ""
set -g status-right ""
# window_id is passed as a cache-buster: tmux keys #() output by the expanded
# command string, so including a value that changes on every window switch
# forces a fresh render. Without it, switches wait for status-interval.
set -g status-format[0] "#(~/.config/tmux/scripts/ghostty-tabs.py '#{client_width}' '#{session_id}' '#{window_id}' '#{session_name}')"
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"
