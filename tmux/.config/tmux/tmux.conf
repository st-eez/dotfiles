# True color support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Start windows and panes at 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix: Ctrl tap (Karabiner sends Ctrl+Space) with Ctrl+b as fallback.
# REQUIRED: prefix2 C-b is load-bearing — Ghostty's Cmd-chords emit `\x02`
# (Ctrl-B) as their prefix byte (see ghostty/.config/ghostty/config:25-42).
# Dropping prefix2 here silently breaks every Cmd+T/W/D/1..9/[/] chord; if
# you ever swap the prefix, update Ghostty's `keybind = super+*=text:\x02*`
# lines too.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Scrollback buffer (default 2000 is too small for Claude Code sessions)
set -g history-limit 50000

# No escape delay (faster neovim mode switching)
set -sg escape-time 0

# Pin copy-mode to vi so prefix+[ uses vim nav, Space begins selection, and
# Enter copies. Without this, tmux infers mode-keys from $EDITOR at server
# start and can land on emacs, silently breaking those defaults.
setw -g mode-keys vi

# Forward OSC52 clipboard writes from apps (Claude Code, Neovim, etc.) out to
# Ghostty so highlight-to-copy inside a mouse-tracking TUI lands on the system
# clipboard. tmux's default is `external`, which only forwards tmux's own
# copy-mode yanks and silently drops OSC52 emitted from inside the pane —
# that's why prefix+[ → Enter copies but Claude Code's "copied" toast never
# reaches the pasteboard. `on` accepts pane OSC52 AND forwards it onward.
set -g set-clipboard on

# New windows/splits open in current directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane cycling: prefix o is the built-in "next pane"; add prefix O for "previous".
# Wired from Ghostty as Cmd+] / Cmd+[ respectively.
bind-key O select-pane -t :.-

# Directional pane navigation without prefix — wired from Ghostty as Cmd+Alt+arrows.
# Raw Alt+arrows are claimed by aerospace at OS level, so Alt+arrow bytes only
# reach tmux via our Cmd+Alt+arrow chord. No-prefix avoids the brief prefix flash.
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Ghostty Cmd+K sends Ctrl+l; clear the pane first, then prune scrollback after redraw
bind-key -n C-l send-keys C-l \; run-shell -b -d 0.2 'tmux clear-history -t "#{pane_id}"'

# Let programs detect pane focus changes
set -g focus-events on

# Allow escape sequences to pass through to Ghostty
set -g allow-passthrough on

# Mouse support
set -g mouse on

# Status row tabs are emitted by ghostty-tabs.py as `#[range=user|N]` (and
# `#[range=user|new-window]` for the trailing `+` cap). User-type ranges
# expose their argument via `#{mouse_status_range}`. We can't use
# `select-window -t=` / `display-menu -t =` here: `=` resolves through
# `mouse_window`, which tmux only populates during its own window-status
# iteration — not for ranges emitted from `#()` substitutions, leaving
# `mouse_window` empty and the click silently no-op.
#
# `select-window -t <target>` does NOT format-expand its target argument
# either, so passing `"#{mouse_status_range}"` directly is taken literally
# ("can't find window: #{mouse_status_range}"). Workaround: invoke through
# `run-shell`, whose command-string IS format-expanded once before the
# shell runs — `tmux select-window -t 2` then resolves normally.
#
# Outer guard: empty range = click landed on row 1, an inter-tab gap, or
# edge padding; no-op cleanly instead of erroring.
bind-key -n MouseDown1Status \
  if-shell -F '#{!=:#{mouse_status_range},}' \
    'if-shell -F "#{==:#{mouse_status_range},new-window}" \
       "new-window -c \"#{pane_current_path}\"" \
       "run-shell \"tmux select-window -t #{mouse_status_range}\""' \
    ''


# Right-click a tab to open the per-window menu (swap/kill/rename/etc).
# Same constraint as MouseDown1Status: `display-menu -t` doesn't expand
# formats, so we route through `run-shell` to substitute the window index
# into the menu's target and every per-window command body.
bind-key -n MouseDown3Status \
  if-shell -F '#{!=:#{mouse_status_range},}' \
    'run-shell "tmux display-menu -T \"Window #{mouse_status_range}\" -t #{mouse_status_range} -x W -y W \
       \"Swap Left\"  l \"swap-window -s #{mouse_status_range} -t :-1\" \
       \"Swap Right\" r \"swap-window -s #{mouse_status_range} -t :+1\" \
       \"\" \
       Kill    X \"kill-window -t #{mouse_status_range}\" \
       Respawn R \"respawn-window -kt #{mouse_status_range}\" \
       Rename  n \"command-prompt -F -I \\\"#W\\\" \\\"rename-window -t #{mouse_status_range} %%\\\"\" \
       \"\" \
       \"New After\"  w \"new-window -a -t #{mouse_status_range}\" \
       \"New At End\" W \"new-window\""' \
    ''

# Auto-rebalance panes evenly when one closes
set-hook -g pane-exited      'select-layout -E'
set-hook -g after-kill-pane   'select-layout -E'

# Sticky spawner-scoped agent attention: entering a window retires every
# attention record whose spawner_pane lives inside it (steez-ht6x).
# after-select-window covers in-session window switches; client-session-changed
# covers cross-session `switch-client -t <session>`, which does not fire
# after-select-window. The helper lives out-of-line because tmux format
# expansion in run-shell consumes `$var`, which would empty any inline
# while/read loop.
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/hooks/ack-spawner-attention.sh \"#{window_id}\""'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/hooks/ack-spawner-attention.sh \"#{window_id}\""'

# Status bar settings
set -g status-position top
set -g status 2
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 0

# Window auto-naming: show directory by default, prefix+, to override
set -g automatic-rename on
set -g automatic-rename-format "/#{b:pane_current_path}"

# Source theme (symlinked by theme-set, sets @thm_* colors)
source-file ~/.config/tmux/theme.conf

# Show pane number on border to indicate active pane
set -g pane-border-status bottom
set -g pane-border-indicators off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# ── Custom status bar (Ghostty-style tabs) ───────────────────────────────────
# A small renderer gives tmux windows equal-width, full-row tab segments.
# Agent attention is rendered inside the tab row; prefix remains on the pane label.
set -g status-style "bg=#{@thm_crust},fg=#{@thm_fg}"
set -g status-left ""
set -g status-right ""
# window_id is passed as a cache-buster: tmux keys #() output by the expanded
# command string, so including a value that changes on every window switch
# forces a fresh render. Without it, switches wait for status-interval.
set -g status-format[0] "#(~/.config/tmux/scripts/ghostty-tabs.py '#{client_width}' '#{session_id}' '#{window_id}' '#{session_name}')"
set -g status-format[1] ""
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"
