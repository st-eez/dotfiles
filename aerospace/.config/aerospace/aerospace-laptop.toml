config-version = 2

# Explicit since config-version = 2 (v1 inferred this from keybinding RHS).
# Must cover every workspace used in bindings and monitor force-assignment.
persistent-workspaces = ['1', '2', '3', '4', '5']

# Native FFM (0.21) is DISABLED: it hit-tests the aerospace tree, not the
# visible Space, so during macOS-native fullscreen video it raises a
# background window and macOS drops out of fullscreen (reproduced 2026-07-03
# with the YouTube Safari web app; upstream gap — the 0.21.1 #2142 fix only
# covers aerospace-fullscreen). AutoRaise stays the hover-raise engine until
# this is fixed upstream. ctrl-alt-a swaps engines (FFM <-> AutoRaise).
focus-follows-mouse.enabled = false

# Mouse lazily follows every KEYBOARD-driven focus change (alt-hjkl, alt-N,
# cmd-tab), replacing the `&& move-mouse window-lazy-center` tail previously
# chained onto every binding, and AutoRaise's warp-on-app-switch.
# All three movers (here + exec-on-workspace-change) go through
# mouse-follows-focus.sh, which owns the shared invariants (details there):
# - never warp while the hand is on the mouse: hover-raising one window of
#   a two-window app (Discord on two monitors) makes macOS front the app's
#   OTHER remembered window, and warping the cursor to it made that steal
#   permanent (reproduced 2026-07-08); unwarped, AutoRaise's retry loop
#   re-raises the hovered window in ~150ms. Our own warps post .mouseMoved
#   events, so the script timestamps executed warps to keep rapid keyboard
#   chains (alt-l alt-l) warping.
# - scrub AEROSPACE_WINDOW_ID/AEROSPACE_WORKSPACE before move-mouse so it
#   resolves LIVE focus — exec-and-forget pins the event's window into the
#   env and the CLI prefers it, which used to warp to the stale window.
# - 50ms settle for WindowServer frame swapping; move-mouse round-tripped
#   through the CLI (in-process it runs BEFORE layoutWorkspaces and reads
#   parked hide-corner rects); moves stay LAZY (force-center would teleport
#   the cursor on click-initiated focus changes older than the guard).
# Exception: in-monitor swaps don't change focus, so no callback fires and
# FFM would refocus the swapped-in neighbor. Swap bindings are therefore
# fully round-tripped through bash: an in-session move-mouse tail reads the
# pre-swap rect and no-ops, and exec-and-forget can't follow '&&' in the
# native shell, so the move itself goes through the CLI too.
on-focus-changed = ['exec-and-forget ~/.config/aerospace/mouse-follows-focus.sh window']
on-focused-monitor-changed = ['exec-and-forget ~/.config/aerospace/mouse-follows-focus.sh monitor']

# Enable normalizations for BSP-like behavior (like yabai)
# This makes windows automatically tile side-by-side similar to yabai's BSP layout
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout for new windows (tiles = BSP-like tiling)
default-root-container-layout = 'tiles'

# Automatically change accordion to tiles when only one window
# accordion-padding = 30

# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  # JankyBorders and SketchyBar have built-in detection of already running process,
  # so they won't be run twice on AeroSpace restart
  'exec-and-forget /opt/homebrew/opt/sketchybar/bin/sketchybar',
  'exec-and-forget /opt/homebrew/opt/borders/bin/borders',
]

# Sketchybar first for instant highlight; then the cursor rescue via
# mouse-follows-focus.sh (settle + mouse-driven-change guard + empty-
# workspace force-center fallback — see on-focus-changed comment).
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '/opt/homebrew/opt/sketchybar/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; $HOME/.config/aerospace/mouse-follows-focus.sh workspace',
]

[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 12
outer.bottom = 12
outer.top = [
  { monitor."built-in" = 12 },
  42,
] # MacBook uses notch space; externals need 42px for SketchyBar
outer.right = 12

# Laptop-only setup - All workspaces on Built-in display
[workspace-to-monitor-force-assignment]
1 = 'built-in' # 5 workspaces on MacBook display
2 = 'built-in'
3 = 'built-in'
4 = 'built-in'
5 = 'built-in'

[mode.main.binding]
# Window focus (CAPS + arrows)
alt-left = 'focus left --boundaries-action fail || focus-monitor left'
alt-right = 'focus right --boundaries-action fail || focus-monitor right'
alt-up = 'focus up --boundaries-action fail || focus-monitor up'
alt-down = 'focus down --boundaries-action fail || focus-monitor down'

# Swap windows with wrap-around (CAPS + SHIFT + arrows)
# Moves within monitor, then wraps to adjacent monitor at boundaries
alt-shift-left = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail left || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window left) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'
alt-shift-right = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail right || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window right) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'
alt-shift-up = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail up || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window up) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'
alt-shift-down = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail down || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window down) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'

# Jump to workspace (CAPS + number) — laptop profile only exposes 1-5
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'


# Move window to workspace and follow (CAPS + SHIFT + number) — laptop profile only exposes 1-5
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1 && workspace 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2 && workspace 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3 && workspace 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4 && workspace 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5 && workspace 5'


# Move window to workspace without following (Custom binding: Ctrl+Shift+Alt+1-9)

# Workspace cycling (CAPS + Tab / CAPS + SHIFT + Tab)
alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'

# Workspace back-and-forth (CTRL + ALT + Tab)
ctrl-alt-tab = 'workspace-back-and-forth'

# Window focus (CAPS + vim keys)
alt-h = 'focus left --boundaries-action fail || focus-monitor left'
alt-l = 'focus right --boundaries-action fail || focus-monitor right'
alt-k = 'focus up --boundaries-action fail || focus-monitor up'
alt-j = 'focus down --boundaries-action fail || focus-monitor down'

# Swap windows with wrap-around (CAPS + SHIFT + vim keys)
# Moves within monitor, then wraps to adjacent monitor at boundaries
alt-shift-h = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail left || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window left) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'
alt-shift-l = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail right || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window right) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'
alt-shift-k = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail up || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window up) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'
alt-shift-j = 'exec-and-forget /bin/bash -c "(/opt/homebrew/bin/aerospace move --boundaries-action fail down || /opt/homebrew/bin/aerospace move-node-to-monitor --wrap-around --focus-follows-window down) && /bin/sleep 0.05 && /opt/homebrew/bin/aerospace move-mouse window-lazy-center"'

# Window controls (CAPS + letter)
alt-t = 'layout floating tiling' # Super+T → Ctrl+T
alt-f = 'fullscreen --no-outer-gaps' # Super+F → Ctrl+F

# Resize windows (CAPS + +/-)
alt-equal = 'resize smart +100'
alt-minus = 'resize smart -100'
alt-shift-equal = 'resize smart +50'
alt-shift-minus = 'resize smart -50'

# Layout management (CTRL + ALT + arrows)
ctrl-alt-left = 'join-with left'
ctrl-alt-right = 'join-with right'
ctrl-alt-up = 'join-with up'
ctrl-alt-down = 'join-with down'

# Workspace cycling on current monitor (CTRL + ALT + SHIFT + left/right)
ctrl-alt-shift-left = 'list-workspaces --monitor focused | move-node-to-workspace --stdin --wrap-around --focus-follows-window prev'
ctrl-alt-shift-right = 'list-workspaces --monitor focused | move-node-to-workspace --stdin --wrap-around --focus-follows-window next'
# Move window to different monitor (CTRL + ALT + SHIFT + up/down)
ctrl-alt-shift-up = 'move-node-to-monitor --wrap-around --focus-follows-window up'
ctrl-alt-shift-down = 'move-node-to-monitor --wrap-around --focus-follows-window down'

# Move window to specific monitor by number (CTRL + ALT + SHIFT + number)
ctrl-alt-shift-1 = 'move-node-to-monitor --focus-follows-window 1'
ctrl-alt-shift-2 = 'move-node-to-monitor --focus-follows-window 2'
ctrl-alt-shift-3 = 'move-node-to-monitor --focus-follows-window 3'

# Configuration management (Custom bindings kept)
ctrl-alt-j = 'layout tiles horizontal vertical'

ctrl-alt-c = 'reload-config'
ctrl-alt-r = 'flatten-workspace-tree'
ctrl-alt-h = 'exec-and-forget ~/.config/aerospace/set-profile.sh home'
ctrl-alt-w = 'exec-and-forget ~/.config/aerospace/set-profile.sh office'
ctrl-alt-l = 'exec-and-forget ~/.config/aerospace/set-profile.sh laptop'
ctrl-alt-a = 'exec-and-forget ~/.config/aerospace/toggle-ffm.sh'

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'IINA'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'pixea'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'numi'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'tlauncher'
run = 'layout floating'

[[on-window-detected]]
# All Google Chrome windows (incl. browse headed test launches) → workspace 4.
# Parks the window off the active workspace so test launches can't tile/cover
# current work. aerospace has no deny-focus primitive: the OS still briefly
# activates Chrome at launch — run tests headless to kill that entirely.
if.app-id = 'com.google.Chrome'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
# Chrome for Testing (bundled Chromium variant) → same workspace 4.
if.app-id = 'com.google.chrome.for.testing'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
run = 'layout floating'
if.app-id = 'net.whatsapp.WhatsApp'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'App Store'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'facetime'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'ghostty'
run = 'layout floating'
