schema_version = 1

[theme]
id = "captain"
name = "Captain"
variant = "dark-tinted"
source = "https://github.com/st-eez/dotfiles"

[identifiers]
ghostty = "Captain"
nvim_colorscheme = "vantablack"
nvim_plugin = "bjarneo/vantablack.nvim"
antigravity = "Vantablack"
opencode = "captain"
obsidian = "Vantablack"

[palette]
bg0 = "#050506"
bg1 = "#151518"
bg2 = "#222226"
fg = "#f4f4f5"
grey = "#a1a1aa"
red = "#d06f82"
orange = "#d4ad86"
yellow = "#f59e0b"
green = "#7da876"
cyan = "#8ba888"
blue = "#38bdf8"
magenta = "#7c6faf"

[overrides.neovim]
config_lua = """
require("vantablack").setup({
  styles = {
    comments = { italic = true },
    keywords = { italic = true },
    functions = {},
    variables = {},
  },
  on_colors = function(colors)
    colors.bg = "#050506"
    colors.bg_dark = "#050506"
    colors.bg_dark1 = "#050506"
    colors.bg_highlight = "#151518"
    colors.fg = "#f4f4f5"
    colors.fg_dark = "#d4d4d8"
    colors.comment = "#a1a1aa"

    -- Vantablack mapping semantics, captain canonical palette.
    colors.red = "#d06f82"
    colors.orange = "#d4ad86"
    colors.yellow = "#f59e0b"
    colors.green = "#7da876"
    colors.cyan = "#8ba888"
    colors.blue = "#38bdf8"
    colors.magenta = "#7c6faf"
  end,
})
"""

[overrides.ghostty]
split_divider_color = "#71717a"

[overrides.ghostty_theme]
file = "captain.ghostty"
background = "#050506"
foreground = "#f4f4f5"
cursor_color = "#f4f4f5"
cursor_text = "#050506"
selection_background = "#222226"
selection_foreground = "#f4f4f5"
color0 = "#050506"
color8 = "#52525b"
color15 = "#ffffff"

[overrides.starship]
character_success_style = "bold #7c6faf"
repo_root_style = "bold #f4f4f5"
git_branch_style = "#a1a1aa"

[overrides.eza]
directory = "35;1"
executable = "37"
symlink = "35"
symlink_path = "90"
build = "37"
source_code = "37"
permission_execute = "90"
permission_execute_other = "90"
permission_group_execute = "90"
permission_other_execute = "90"
size_number = "37"
size_unit = "90"

[overrides.sketchybar]
highlight = "#7c6faf"
border = "#222226"
