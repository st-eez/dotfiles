# Captain theme - Catppuccin color overrides
# Managed by theme-set - do not edit manually

# Base
set -g @thm_bg "#151518"
set -g @thm_fg "#f4f4f5"
set -g @thm_crust "#050506"
set -g @thm_mantle "#050506"

# Surfaces
set -g @thm_surface_0 "#222226"
set -g @thm_surface_1 "#222226"
set -g @thm_surface_2 "#a1a1aa"

# Overlays
set -g @thm_overlay_0 "#a1a1aa"
set -g @thm_overlay_1 "#a1a1aa"
set -g @thm_overlay_2 "#a1a1aa"

# Text
set -g @thm_subtext_0 "#f4f4f5"
set -g @thm_subtext_1 "#f4f4f5"

# Accents
set -g @thm_red "#d06f82"
set -g @thm_maroon "#d4ad86"
set -g @thm_peach "#d4ad86"
set -g @thm_yellow "#f59e0b"
set -g @thm_green "#7da876"
set -g @thm_teal "#8ba888"
set -g @thm_sky "#38bdf8"
set -g @thm_sapphire "#8ba888"
set -g @thm_blue "#38bdf8"
set -g @thm_lavender "#7c6faf"
set -g @thm_mauve "#7c6faf"
set -g @thm_pink "#d06f82"
set -g @thm_flamingo "#d06f82"
set -g @thm_rosewater "#f4f4f5"

# Borders
set -g @borders_active_color "#f4f4f5"
set -g @borders_inactive_color "#222226"

# Window overrides
set -g @catppuccin_window_current_number_color "#{@thm_teal}"
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"

# Status module overrides (bypasses plugin -o caching on reload)
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_mauve},#{E:@thm_green}}"
set -g @catppuccin_status_application_icon_bg "#38bdf8"
set -g @catppuccin_status_uptime_icon_bg "#f59e0b"

# Pane borders
set -g pane-border-style "fg=#222226"
set -g pane-active-border-style "fg=#f4f4f5"
set -g pane-border-format "#{?pane_active,#{?client_prefix,#[fg=#f4f4f5]#[fg=#f4f4f5 bg=#f4f4f5 bold]PREFIX #{window_index}.#{pane_index}#[fg=#f4f4f5 bg=default]#[default],#[fg=#f4f4f5]#[fg=#050506 bg=#f4f4f5 bold]#{window_index}.#{pane_index}#[fg=#f4f4f5 bg=default]#[default]},#[fg=#222226]#[fg=#a1a1aa bg=#222226]#{window_index}.#{pane_index}#[fg=#222226 bg=default]#[default]}"
