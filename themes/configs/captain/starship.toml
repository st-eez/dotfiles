# Captain Starship theme
# Managed by theme-set - do not edit manually
add_newline = true
command_timeout = 200
format = "$os$hostname$directory$git_branch$git_status$character"

[os]
disabled = false
style = "#f4f4f5"

[os.symbols]
Macos = "󰀵 "
Arch = "󰣇 "
Ubuntu = " "
Mint = "󰣭 "
Linux = " "

[hostname]
ssh_only = true
format = "[$hostname](#f4f4f5):"

[character]
error_symbol = "[✘](bold #d06f82)"
success_symbol = "[❯](bold #7c6faf)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "#f4f4f5"
before_repo_root_style = "#f4f4f5"
repo_root_style = "bold #f4f4f5"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "#a1a1aa"

[git_status]
format = '$all_status$ahead_behind'
ahead = "[⇡${count}](#7da876) "
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](#7c6faf) "
behind = "[⇣${count}](#7c6faf) "
conflicted = "[](#d06f82) "
up_to_date = ""
untracked = "[?](#7c6faf) "
modified = "[](#7c6faf) "
stashed = ""
staged = "[](#7c6faf) "
renamed = "[](#7c6faf) "
deleted = "[](#7c6faf) "
