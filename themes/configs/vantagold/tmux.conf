# Vantagold theme - Catppuccin color overrides
# Managed by theme-set - do not edit manually

# Base
set -g @thm_bg "#101010"
set -g @thm_fg "#eadfca"
set -g @thm_crust "#050505"
set -g @thm_mantle "#050505"

# Surfaces
set -g @thm_surface_0 "#201b12"
set -g @thm_surface_1 "#201b12"
set -g @thm_surface_2 "#8f8778"

# Overlays
set -g @thm_overlay_0 "#8f8778"
set -g @thm_overlay_1 "#8f8778"
set -g @thm_overlay_2 "#8f8778"

# Text
set -g @thm_subtext_0 "#eadfca"
set -g @thm_subtext_1 "#eadfca"

# Accents
set -g @thm_red "#c8a24a"
set -g @thm_maroon "#b9853d"
set -g @thm_peach "#b9853d"
set -g @thm_yellow "#d6b85c"
set -g @thm_green "#8fa477"
set -g @thm_teal "#7f9f9a"
set -g @thm_sky "#8f9ebc"
set -g @thm_sapphire "#7f9f9a"
set -g @thm_blue "#8f9ebc"
set -g @thm_lavender "#ad8fa8"
set -g @thm_mauve "#ad8fa8"
set -g @thm_pink "#c8a24a"
set -g @thm_flamingo "#c8a24a"
set -g @thm_rosewater "#eadfca"

# Borders
set -g @borders_active_color "#c8a24a"
set -g @borders_inactive_color "#3a3323"

# Window overrides
set -g @catppuccin_window_current_number_color "#{@thm_teal}"
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"

# Status module overrides (bypasses plugin -o caching on reload)
set -g @catppuccin_session_color "#{?client_prefix,#{E:@thm_mauve},#{E:@thm_green}}"
set -g @catppuccin_status_application_icon_bg "#8f9ebc"
set -g @catppuccin_status_uptime_icon_bg "#d6b85c"

# Pane borders
set -g pane-border-style "fg=#3a3323"
set -g pane-active-border-style "fg=#c8a24a"
set -g pane-border-format "#{?pane_active,#{?client_prefix,#[fg=#c8a24a]#[fg=#eadfca bg=#c8a24a bold]PREFIX #{window_index}.#{pane_index}#[fg=#c8a24a bg=default]#[default],#[fg=#c8a24a]#[fg=#050505 bg=#c8a24a bold]#{window_index}.#{pane_index}#[fg=#c8a24a bg=default]#[default]},#[fg=#3a3323]#[fg=#8f8778 bg=#3a3323]#{window_index}.#{pane_index}#[fg=#3a3323 bg=default]#[default]}"
